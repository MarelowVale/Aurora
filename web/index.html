<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<title>Aurora</title>
<link rel="stylesheet" href="app.css?v=9">
</head>
<body>
<div id="backdrop-fallback"></div>
<div id="backdrop"></div>

<div id="app" class="in">
  <!-- 标题栏 -->
  <header id="titlebar">
    <div class="traffic">
      <button class="light red" id="tl-close" title="关闭">
        <svg viewBox="0 0 10 10"><path d="M2.6 2.6 7.4 7.4M7.4 2.6 2.6 7.4" stroke="rgba(0,0,0,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="light yellow" id="tl-min" title="最小化">
        <svg viewBox="0 0 10 10"><path d="M2.4 5h5.2" stroke="rgba(0,0,0,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="light green" id="tl-max" title="最大化">
        <svg viewBox="0 0 10 10"><path d="M3 6.9V3h3.9M7 3.1 3.1 7" stroke="rgba(0,0,0,.55)" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="title-title" id="win-title">Aurora</div>
    <div id="drag-region"></div>
    <div class="title-actions">
      <button class="gbtn" id="btn-new" title="新建文件夹 (Ctrl+Shift+N)"></button>
      <button class="gbtn" id="btn-refresh" title="刷新 (F5)"></button>
      <button class="gbtn" id="btn-palette" title="命令面板 (Ctrl+K)">⌘K</button>
      <button class="gbtn" id="btn-ai" title="AI 助手 (Ctrl+J)"></button>
      <button class="gbtn" id="btn-settings" title="设置 (Ctrl+,)"></button>
    </div>
  </header>

  <div id="body">
    <aside id="sidebar">
      <div id="sidebar-scroll"></div>
    </aside>

    <main id="main">
      <div id="tabs">
        <div id="tabs-strip"></div>
        <button class="gbtn tab-new" id="tab-new" title="新建标签页 (Ctrl+T)"></button>
      </div>

      <div id="toolbar">
        <div class="nav-btns">
          <button class="gbtn" id="nav-back" title="后退 (Alt+←)"></button>
          <button class="gbtn" id="nav-fwd" title="前进 (Alt+→)"></button>
          <button class="gbtn" id="nav-up" title="上一级 (Backspace)"></button>
        </div>
        <div id="crumbs"></div>
        <div id="search-wrap">
          <span id="search-icon"></span>
          <input id="search" type="text" placeholder="搜索 D 盘…" spellcheck="false" autocomplete="off">
          <span class="ai-chip" id="ai-chip" title="用 AI 理解自然语言">AI</span>
          <button class="gbtn" id="search-clear" style="display:none;width:18px;min-width:18px;height:18px" title="清除"></button>
        </div>
        <div class="seg" style="display:flex;gap:2px">
          <button class="gbtn" id="view-grid" title="网格视图 (Ctrl+1)"></button>
          <button class="gbtn" id="view-list" title="列表视图 (Ctrl+2)"></button>
        </div>
        <button class="gbtn" id="btn-inspector" title="显示/隐藏信息面板"></button>
        <button class="gbtn" id="btn-more" title="更多"></button>
      </div>

      <div id="filters"></div>

      <div id="content" tabindex="0">
        <div id="grid" style="display:none"></div>
        <div id="list" style="display:none"></div>
      </div>
    </main>

    <aside id="inspector">
      <div id="inspector-scroll"></div>
    </aside>
  </div>

  <div id="statusbar">
    <span id="st-count">就绪</span>
    <span class="spacer"></span>
    <span class="index-pill" id="st-index"><i class="led"></i><span>索引</span></span>
    <span class="sep"></span>
    <span id="st-space"></span>
  </div>
</div>

<div id="overlay"></div>
<div id="quicklook"><div class="ql-inner"></div></div>
<div id="toasts"></div>
<div id="menu-root"></div>

<script type="module" src="app.js?v=9"></script>
</body>
</html>
